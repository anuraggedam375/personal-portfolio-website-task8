<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Form — Nova</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body class="form-page"><header class="site-header"><a class="brand" href="index.html">nova<span>.</span></a><nav><a href="index.html">Home</a><a href="portfolio.html">Portfolio</a></nav></header>
<main class="form-wrap"><div class="form-intro"><p class="eyebrow">LET'S TALK</p><h1>Have a project<br><em>in mind?</em></h1><p class="lead">Send a message using the form. Fields are validated in your browser for this demo.</p></div>
<form id="contactForm" class="contact-form" novalidate><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Your name" required minlength="2"><small class="error" id="nameError"></small>
<label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required><small class="error" id="emailError"></small>
<label for="phone">Phone number</label><input id="phone" name="phone" type="tel" placeholder="+91 98765 43210" required pattern="[0-9+() -]{7,}"><small class="error" id="phoneError"></small>
<label for="message">Message</label><textarea id="message" name="message" rows="4" placeholder="Tell me a little about your idea..." required minlength="10"></textarea><small class="error" id="messageError"></small>
<button class="button primary submit-button" type="submit">Send message ↗</button><p id="formStatus" class="form-status" role="status" aria-live="polite"></p></form></main><footer><a class="brand" href="index.html">nova<span>.</span></a><small>Demo form — no information is sent to a server.</small></footer></body></html>
